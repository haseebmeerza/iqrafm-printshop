<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQRA &amp; FM PRINT SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--h:#1f56a8;--sub:#dbe8f8;--bg:#f2f6fc;--line:#6f8fbf;--soft:#b9c9e2;--txt:#12315e;--red:#c0392b;--or:#ff8c1a;color-scheme:light}
*{box-sizing:border-box}html{font-size:17px}body{margin:0;background:var(--bg);color:var(--txt);font:1rem/1.45 'Bricolage Grotesque',system-ui,sans-serif}[hidden]{display:none!important}
.banner{position:relative;height:92px;background:#1f56a8 center 35%/cover no-repeat;border-bottom:4px solid var(--or);color:#fff}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,45,95,.92),rgba(15,45,95,.55) 55%,rgba(15,45,95,.1))}
.bc{position:relative;height:100%;display:flex;gap:14px;align-items:center;padding:0 16px}
.lg{width:66px;height:66px;border-radius:50%;border:3px solid #fff;background:#fff;flex:none}
.bc h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:.5px;line-height:1.1;text-shadow:0 2px 4px rgba(0,0,0,.5)}.bc p{margin:2px 0 0;font-size:.78rem;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.3}
.wrap{display:flex;align-items:flex-start;min-height:64vh}
aside{width:250px;flex:none;background:var(--sub);padding:10px;border-right:2px solid var(--line);position:sticky;top:0;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
aside .sh{background:var(--h);color:#fff;font-weight:800;padding:7px 10px;border-radius:5px;margin-top:8px;font-size:1rem}
aside button{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:9px 12px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
aside button:hover{background:#eef4fc}aside button.on{background:var(--or);border-color:#d96f00;color:#1a1200}
main{flex:1;min-width:0;padding:16px;text-align:left}
.ph{margin:0 0 12px;padding:10px 14px;background:var(--h);color:#fff;border-radius:6px;font-size:1.3rem;font-weight:800;text-align:left}
.hint{margin:0 0 10px;padding:7px 12px;background:var(--sub);border:1px solid var(--soft);border-radius:6px;font-size:.88rem}
.strip{margin:0 0 10px;padding:8px 12px;background:var(--sub);border:1px solid var(--soft);border-radius:6px;font-weight:600}
.bar{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap;align-items:center}
.b{background:var(--h);color:#fff;border:1px solid var(--h);border-radius:6px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.b.g{background:#fff;color:var(--h);border-color:var(--line)}.b.r{background:#fff;color:var(--red);border-color:var(--red)}.b.wa{background:#1d8a4a;border-color:#1d8a4a}.sm{padding:3px 10px;font-size:.85rem}
.fb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.fb label{font-weight:700;font-size:.85rem}
input,select{font:inherit;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;height:42px}
.fb input[type=text]{flex:1;min-width:200px}.fb input[type=date]{width:165px}
.gw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
table{border-collapse:collapse;width:max-content;min-width:100%}
th{background:var(--h);color:#fff;border:1px solid #163f80;padding:9px 10px;text-align:left;font-size:.9rem;white-space:nowrap}
td{border:1px solid var(--soft);padding:8px 10px;vertical-align:top;text-align:left;font-size:.95rem}
table.r tr:nth-child(even) td{background:#f4f8fd}tr.tf td{background:var(--sub)!important;font-weight:700}
table.g td{padding:0;background:#fff}table.g td.n{width:50px;text-align:center;font-weight:700;background:var(--sub);padding:0 6px;vertical-align:middle}
table.g td.c{padding:0 12px;font-weight:800;background:#f1f6fd;white-space:nowrap;vertical-align:middle}
table.g input,table.g select{border:0;border-radius:0;height:46px;padding:6px 8px;width:100%;min-width:105px;background:transparent;font-size:1.02rem}
table.g input.w2{min-width:210px}table.g input[type=date]{min-width:150px}table.g input[type=month]{min-width:150px}
table.g input:focus,table.g select:focus{outline:3px solid var(--or);outline-offset:-3px;background:#fff6e0}
table.g tr:focus-within td{background:#fff1d1}table.g tr:focus-within td.n,table.g tr:focus-within td.c{background:#ffdf9c}table.g td:focus-within{background:#ffd27a}
.bad{color:var(--red)}.ok{color:#17803d}tr.low td{background:#fde4e1!important;color:#8e1f14}.lowtag{background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-size:.72rem;font-weight:800}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.8rem;background:#fff}
.empty{padding:22px;border:2px dashed var(--line);border-radius:6px;background:#fff}
.own{margin:0;padding:10px 16px;background:#fff;border-top:3px solid var(--h);font-size:.78rem;color:#33415f;text-align:left}
#login{display:flex;justify-content:center;padding:26px 14px;background:linear-gradient(135deg,#dbe8f8,#f6f9fd)}
#login form{background:#fff;border:2px solid var(--line);border-radius:12px;padding:24px 22px;width:min(400px,100%);text-align:center}
#login .lg{width:150px;height:150px;border-color:var(--h)}#login h2{margin:10px 0 14px;color:var(--h)}#login input{width:100%;margin-bottom:10px;text-align:left}#pwerr{color:var(--red);min-height:20px;margin:8px 0 0;font-size:.85rem}
#modal{position:fixed;inset:0;background:rgba(10,30,60,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#modal.on{display:flex}
#modal .box{background:#fff;border-radius:8px;width:min(720px,100%);max-height:92vh;overflow:auto}#modal .mh{margin:0;padding:10px 16px;background:var(--h);color:#fff;font-size:1.1rem}#modal .mb{padding:16px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--h);color:#fff;padding:9px 18px;border-radius:99px;display:none;z-index:30;max-width:92vw}
.vf{width:100%;min-width:0;table-layout:fixed;border:1px solid var(--line);background:#fff}
.vf td{padding:0;border:1px solid var(--line);background:#fff;height:48px;vertical-align:middle;text-align:left}
.vf td:first-child{width:42%;padding:4px 12px;font-weight:700;background:var(--sub);line-height:1.2}.vf td:first-child small{display:block;font-weight:400;font-size:.76rem;color:#3a5584}
.vf input,.vf select{border:0;border-radius:0;height:48px;width:100%;background:transparent;padding:6px 10px;font-size:1.02rem}
.vf input:focus,.vf select:focus{outline:3px solid var(--or);outline-offset:-3px;background:#fff6e0}
.vf tr:focus-within td:last-child{background:#fff1d1}.vf tr:focus-within td:first-child{background:#ffdf9c}
.vf td.calc{padding:0 12px;font-weight:800;background:#f1f6fd;font-size:1.1rem}.vf tr.sep td{background:var(--h)!important;color:#fff;font-weight:700;padding:0 12px;height:40px}
.two{display:flex}.two>*{flex:1;min-width:0}.two>*+*{border-left:1px solid var(--line)}
.kv td:first-child{background:var(--sub);font-weight:700;width:230px}.kv{min-width:0;width:100%}
.sub{margin:16px 0 8px;padding:7px 12px;background:var(--sub);border:1px solid var(--soft);border-radius:6px;font-weight:800}
@media(max-width:760px){.wrap{flex-direction:column;align-items:stretch}aside{width:auto;max-height:none;flex-direction:row;overflow-x:auto;padding:6px;z-index:5;border-right:0;border-bottom:2px solid var(--line)}aside .sh{display:none}aside button{white-space:nowrap}.bc h1{font-size:1.15rem}.bc p{display:none}.lg{width:54px;height:54px}.kv td:first-child{width:130px}}
</style></head><body>

<div id="login"><form onsubmit="return login(event)"><img class="lg" data-logo alt="Logo"><h2>IQRA &amp; FM PRINT SHOP</h2><input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus><button class="b" style="width:100%;padding:11px">Open</button><p id="pwerr"></p></form></div>
<div id="app" hidden><div class="wrap"><aside id="side"></aside><main id="main"></main></div></div>

w.document.write(`<html><head><title>${P(k)}${o.no}</title><style>*{color:#000!important;background:#fff!important;border-color:#000!important}body{font:15px Arial,sans-serif;max-width:390px;margin:8px auto}table{width:100%;border-collapse:collapse}td,th{border:1px solid #000;padding:5px 6px}img{filter:grayscale(1) contrast(1.8)}.n{border:2px solid #000;padding:6px;font-size:12.5px;margin-top:10px}@media print{body{margin:0}}</style></head><body><center><img src="${LOGO}" width=64><h3 style="margin:4px 0">IQRA &amp; FM PRINT SHOP</h3><small>Owner: Muneeb Mirza<br>${ADDR}<br>0348 2211032 · 0332 3420642</small></center><hr><b>${P(k)}${o.no}</b> · ${o.date}<br>${esc(o.customer||'Walk-in customer')} ${esc(o.contact)}${o.type?'<br>Order type: '+esc(o.type):''}<br><br><table><tr><th align=left>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td align=center>${i.qty} ${esc(i.unit||'')}</td><td align=right>${rs(i.price)}</td><td align=right>${rs(num(i.qty)*num(i.price))}</td></tr>`).join('')}${num(o.other)>0?R('Other',rs(o.other)):''}${num(o.disc)>0?R('Discount','- '+rs(o.disc)):''}${R('Total',rs(t.total),1)}${o.pay.map(p=>R('Received ('+p.m+') '+p.d,rs(p.amt))).join('')}${R('Balance',rs(t.bal),1)}</table><center style="margin-top:8px">100% Trusted · Premium Quality · Thank you!</center><div class="n">${NOTE}</div><script>setTimeout(function(){print()},300)<\/script></body></html>`);w.document.close()}
function billText(k,o){const t=dt(o);return ['*IQRA & FM PRINT SHOP*',ADDR,'0348 2211032 · 0332 3420642','',P(k)+o.no+' · '+o.date,'Customer: '+(o.customer||'Walk-in'),o.type?'Order type: '+o.type:'',...o.items.map(i=>i.name+' × '+i.qty+' '+(i.unit||'')+' @ '+rs(i.price)+' = '+rs(num(i.qty)*num(i.price))),num(o.other)>0?'Other: '+rs(o.other):'',num(o.disc)>0?'Discount: -'+rs(o.disc):'','*Total: '+rs(t.total)+'*',...o.pay.map(p=>'Received ('+p.m+'): '+rs(p.amt)),'*Balance: '+rs(t.bal)+'*','','Thank you!','_'+NOTE+'_'].filter(x=>x!=='').join('\n')}
function sendWA(k,id){const o=find(k,id);let d=String(o.contact||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='92'+d.slice(1);if(d.length<10)return toast('This customer has no valid WhatsApp number');
if(!open('https://wa.me/'+d+'?text='+encodeURIComponent(billText(k,o)),'_blank'))toast('Pop-up blocked. Allow pop-ups for this page and try again.')}
function savedModal(k,list){$('#modal').innerHTML=`<div class="box"><h3 class="mh">Saved ✔ — print the bill or send it on WhatsApp</h3><div class="mb"><div class="gw"><table class="r"><tr><th>No.</th><th>Customer</th><th>Total</th><th>Print (black)</th><th>WhatsApp</th></tr>${list.map(o=>`<tr><td>${P(k)}${o.no}</td><td>${esc(o.customer||'Walk-in')}</td><td>${rs(dt(o).total)}</td><td><button class="b sm" onclick="printBill('${k}','${o.id}')">Print bill</button></td><td><button class="b wa sm" onclick="sendWA('${k}','${o.id}')">WhatsApp</button></td></tr>`).join('')}</table></div><div class="bar"><button class="b g" onclick="$('#modal').className=''">Close</button></div></div></div>`;$('#modal').className='on'}
function recv(k,id){const o=find(k,id),t=dt(o);if(t.bal<=0)return toast('Nothing left to collect');
$('#modal').innerHTML=`<div class="box"><h3 class="mh">Receive payment — ${P(k)}${o.no}</h3><div class="mb"><div class="gw"><table class="r kv"><tr><td>Balance due</td><td><b>${rs(t.bal)}</b></td></tr><tr><td>Amount received (Rs)</td><td><input id="r1" type="number" value="${Math.round(t.bal)}"></td></tr><tr><td>Paid by</td><td><select id="r2">${PAY.map(m=>`<option>${m}</option>`).join('')}</select></td></tr></table></div><div class="bar"><button class="b" onclick="saveRecv('${k}','${id}')">Save payment</button><button class="b g" onclick="$('#modal').className=''">Cancel</button></div></div></div>`;$('#modal').className='on'}
function saveRecv(k,id){const a=num($('#r1').value);if(!(a>0))return toast('Enter the amount');find(k,id).pay.push({amt:a,m:$('#r2').value,d:today()});$('#modal').className='';save();render();toast('Payment added')}

`<tr class="tf"><td colspan="${isO?9:8}">Total</td><td>${rs(T.n)}</td><td>${rs(T.r)}</td><td></td><td>${rs(T.b)}</td>${isO?'<td></td>':''}<td></td></tr>`)}
function invBody(){const q=flt.q.toLowerCase(),L=S.inv.filter(i=>(i.name+i.size+i.sup+i.loc).toLowerCase().includes(q)),lo=S.inv.filter(isLow),cv=S.inv.reduce((a,i)=>a+i.qty*(num(i.cost)+num(i.over)),0),nv=S.inv.reduce((a,i)=>a+i.qty*netP(i),0);
const head=strip(`Items ${S.inv.length} · Low or out of stock <span class="${lo.length?'bad':''}">${lo.length}</span> · Stock value (cost) ${rs(cv)} · Stock value (net price) ${rs(nv)}`)+(lo.length?`<div class="strip" style="background:#fde4e1;border-color:var(--red);color:#8e1f14">⚠ Running low: ${lo.map(i=>esc(lbl(i))+' ('+i.qty+' '+i.unit+')').join(', ')}</div>`:'');

async function sha(t){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
function show(){$('#login').hidden=true;$('#app').hidden=false;render();autoSync()}
async function login(e){e.preventDefault();if(await sha($('#pw').value.trim())===HASH){localStorage.setItem('mmps_auth',HASH);show()}else{$('#pwerr').textContent='Wrong password. Try again.';$('#pw').select()}return false}
